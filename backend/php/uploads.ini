; Media upload limits for the course-author upload endpoint.
;
; PHP defaults (upload_max_filesize=2M, post_max_size=8M) reject the audio and
; video sizes the media allow-list accepts, and a rejected body arrives at
; Laravel as "The file failed to upload." These values match
; backend/app/Http/Controllers/MediaController.php (video 200 MB max).
;
; Loaded by backend/bin/artisan. A deployed server must configure the same
; limits in its PHP-FPM/Nginx (client_max_body_size) configuration.

upload_max_filesize = 200M
post_max_size = 210M
max_file_uploads = 20
