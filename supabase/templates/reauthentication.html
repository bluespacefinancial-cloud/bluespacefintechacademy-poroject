<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BlueSPACE verification code</title></head>
  <body style="margin:0;background:#f5f7fb;color:#172033;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px;background:#f5f7fb"><tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border:1px solid #e5e7eb;border-radius:8px">
        <tr><td style="padding:26px 32px;border-bottom:1px solid #e5e7eb"><img src="{{ .SiteURL }}/logo-dark.png" width="220" alt="BlueSPACE Financial Cloud" style="display:block;width:220px;max-width:100%;height:auto"></td></tr>
        <tr><td style="padding:30px 32px"><h1 style="margin:0 0 16px;color:#0000ff;font-size:24px">Confirm it is you</h1>
          <p style="font-size:15px;line-height:1.65">Enter this one-time code to continue with your secure account change:</p>
          <p style="padding:16px;background:#f0f0ff;color:#0000ff;text-align:center;font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
          <p style="font-size:13px;line-height:1.6;color:#64748b">This code expires shortly. If you did not request it, ignore this email.</p>
        </td></tr>
        <tr><td style="padding:18px 32px;background:#f8fafc;border-top:1px solid #e5e7eb;color:#64748b;font-size:12px;line-height:1.6">BlueSPACE Fintech Academy</td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
