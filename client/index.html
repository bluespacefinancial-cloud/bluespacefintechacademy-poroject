<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build practical fintech skills through BlueSPACE Fintech Academy fellowships, project-based learning, and industry collaboration." />
    <script>
      // Apply the saved theme before the first paint so there is no light flash.
      (function () {
        try {
          var saved = localStorage.getItem('bluespace-dark-mode')
          var dark = saved !== null
            ? saved === 'true'
            : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable — fall back to the light theme */
        }
      })()
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>BlueSPACE Fintech Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
